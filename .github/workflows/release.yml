name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package release archive
        run: |
          mkdir -p dist
          zip -r "dist/win-dpi-bypass-${{ github.ref_name }}.zip" . \
            -x ".git/*" ".github/*" "_cache/*" "logs/*" "lists/domains-auto.txt" "logs-export.path" "*.log"

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/win-dpi-bypass-${{ github.ref_name }}.zip
          generate_release_notes: true
